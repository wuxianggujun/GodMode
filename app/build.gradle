apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'tiiehenry.viewcontroller'
    compileSdkVersion 31
    buildFeatures {
        buildConfig true
        aidl true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    defaultConfig {
        applicationId "tiiehenry.viewcontroller"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode new Date().format('yyMMdd').toInteger()
        versionName new Date().format('yy.MM.dd')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }
    productFlavors {
    }

    // 上游残缺的第三方库源码拷贝（缺 tiiehenry.android.ui.dialogs.api 等整棵子树），
    // 本模块代码、AndroidManifest、proguard 全部不引用，已整体移到 src/deprecated/java，
    // 留在源码树外不参与编译。AGP 8 的 sourceSets exclude 对 Kotlin sourceSet 不生效，
    // 物理移出是唯一可靠手段。
    sourceSets {
        main {
            java {
                exclude 'com/lxj/androidktx/**'
                exclude 'tiiehenry/android/ui/dialogs/**'
                exclude 'tiiehenry/android/view/loadingview/**'
            }
        }
    }
}
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def versionName = variant.versionName
        def buildType = variant.buildType.name
        if (buildType == "release") {
            versionName = output.versionNameOverride
        }
        def fileName = "GodMode+_v${versionName}_${buildType}.apk"
        output.outputFileName = fileName
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':libxservicemanager')
//    implementation project(path: ':libhotloader')
//    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.3.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "androidx.fragment:fragment:1.4.1"
//    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'


    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.0'

    implementation 'androidx.core:core-ktx:1.7.0'

    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
}
